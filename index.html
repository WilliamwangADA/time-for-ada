<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ada的时间之旅</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1226">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="时间之旅">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="preload" as="image" href="assets/art/cover_bg.jpg">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#0b1226; color:#f2ead9;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    overscroll-behavior:none; -webkit-touch-callout:none; touch-action:manipulation;
    -webkit-user-select:none; user-select:none;
  }
  #app { position:fixed; inset:0; }
  .screen { position:absolute; inset:0; display:none; }
  .screen.active { display:block; }

  /* ---------- 开始页 ---------- */
  #startScreen { display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:18px;
    padding-bottom:7vh;
    background:radial-gradient(ellipse at 50% 120%, #1d2c54 0%, #0b1226 60%, #060a18 100%); }
  #startScreen .bgArt { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
  #startScreen::after { content:''; position:absolute; inset:0; z-index:1;
    background:linear-gradient(180deg, transparent 55%, rgba(6,10,24,.72) 100%); }
  #startScreen > *:not(.bgArt) { position:relative; z-index:2; }
  #startScreen.screen { display:none; } #startScreen.screen.active { display:flex; }
  #startTitle { font-size:min(9vw,58px); font-weight:700; letter-spacing:6px; color:#ffe9b8;
    text-shadow:0 2px 18px rgba(0,0,0,.85), 0 0 40px rgba(232,185,106,.35); }
  #startSub { font-size:min(4vw,20px); color:#dfe4f2; letter-spacing:2px; text-shadow:0 1px 8px rgba(0,0,0,.8); }
  #startBtn { margin-top:10px; padding:18px 64px; font-size:min(6vw,30px); font-weight:700; color:#241a05;
    background:linear-gradient(180deg,#ffe2a0,#e0a94f); border:none; border-radius:60px;
    box-shadow:0 6px 24px rgba(224,169,79,.45), inset 0 2px 0 rgba(255,255,255,.6); cursor:pointer; }
  #startBtn:active { transform:scale(.95); }
  .startClock { width:min(30vw,150px); height:min(30vw,150px); }

  /* ---------- 地图页 ---------- */
  #mapScreen { background:radial-gradient(ellipse at 50% 0%, #17244a 0%, #0b1226 55%, #070c1a 100%); }
  #mapScreen .bgArt { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
  #mapTitle, #mapPath { z-index:2; }
  #mapTitle { position:absolute; top:max(10px, env(safe-area-inset-top)); width:100%; text-align:center;
    font-size:min(5vw,26px); color:#e8d9b0; letter-spacing:4px; z-index:2; }
  #mapPath { position:absolute; inset:0; width:100%; height:100%; }
  .mapNode { position:absolute; width:min(11vw,74px); height:min(11vw,74px); border-radius:50%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transform:translate(-50%,-50%); cursor:pointer; z-index:3; }
  .mapNode .num { font-size:min(4.2vw,26px); font-weight:700; color:#fff; }
  .mapNode .lbl { position:absolute; top:104%; white-space:nowrap; font-size:min(2.8vw,14px); color:#fff;
    font-weight:600; text-shadow:0 1px 4px rgba(0,0,0,.85), 0 0 10px rgba(0,0,0,.5); }
  .mapNode.todo { background:radial-gradient(circle at 35% 30%, #55628c, #2c3556); box-shadow:0 0 10px rgba(120,140,200,.25); }
  .mapNode.todo .num { filter:saturate(.7) brightness(.9); }
  .mapNode.open { background:radial-gradient(circle at 35% 30%, #ffe9b0, #d99a37);
    box-shadow:0 0 26px rgba(233,182,90,.65); animation:pulse 1.8s ease-in-out infinite; }
  .mapNode.open .num { color:#3a2703; }
  .mapNode.done { background:radial-gradient(circle at 35% 30%, #9fd8ff, #3d7fc1); box-shadow:0 0 14px rgba(120,180,255,.4); }
  @keyframes pulse { 0%,100%{transform:translate(-50%,-50%) scale(1);} 50%{transform:translate(-50%,-50%) scale(1.1);} }

  /* ---------- 关卡页 ---------- */
  #levelScreen { background:#0b1226; }
  #stage { position:absolute; inset:0; }
  #stage svg { display:block; position:absolute; inset:0; width:100%; height:100%; }
  .artStack { position:absolute; inset:0; }
  .artStack img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    transition:opacity .9s ease; }

  /* 场景转场（星空淡入淡出） */
  #fadeOverlay { position:fixed; inset:0; background:
    radial-gradient(2px 2px at 20% 30%, #fff8, transparent 60%),
    radial-gradient(2px 2px at 70% 20%, #fff6, transparent 60%),
    radial-gradient(2px 2px at 40% 70%, #fff7, transparent 60%),
    radial-gradient(2px 2px at 85% 60%, #fff5, transparent 60%),
    #0b1226; opacity:0; pointer-events:none; transition:opacity .28s ease; z-index:80; }
  #fadeOverlay.show { opacity:1; }

  /* 触摸星光 */
  .spark { position:fixed; width:9px; height:9px; pointer-events:none; z-index:99;
    background:radial-gradient(circle, #fff, #ffd977 60%, transparent); border-radius:50%;
    animation:sparkFly .65s ease-out forwards; }
  @keyframes sparkFly { to { transform:translate(var(--dx),var(--dy)) scale(0); opacity:0; } }

  /* 发呆提示小手 */
  #hintHand { position:fixed; font-size:min(9vw,52px); z-index:60; pointer-events:none; display:none;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.6)); animation:handTap 1.1s ease-in-out infinite; }
  #hintHand.show { display:block; }
  @keyframes handTap { 0%,100%{transform:translate(-30%,-10%) scale(1);} 50%{transform:translate(-30%,-10%) scale(.8) translateY(10px);} }
  #hud { position:absolute; top:max(8px, env(safe-area-inset-top)); left:0; width:100%;
    display:flex; align-items:center; justify-content:space-between; padding:0 14px; z-index:20; pointer-events:none; }
  .hudBtn { pointer-events:auto; width:min(11vw,56px); height:min(11vw,56px); border-radius:50%;
    border:2px solid rgba(255,255,255,.25); background:rgba(10,16,38,.55); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .hudBtn svg { width:58%; height:58%; }
  #levelTitle { font-size:min(4.6vw,24px); letter-spacing:3px; color:#f2e6c8;
    background:rgba(10,16,38,.55); padding:6px 22px; border-radius:30px;
    backdrop-filter:blur(4px); text-shadow:0 2px 8px rgba(0,0,0,.7); pointer-events:none; }

  /* 完成浮层 */
  #doneOverlay { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    flex-direction:column; gap:22px; background:rgba(6,10,24,.55); z-index:30; }
  #doneOverlay.show { display:flex; }
  #doneStar { width:min(34vw,170px); height:min(34vw,170px); animation:starIn .7s ease-out; }
  @keyframes starIn { 0%{transform:scale(0) rotate(-40deg);} 70%{transform:scale(1.15);} 100%{transform:scale(1);} }
  #doneMsg { font-size:min(5.5vw,30px); font-weight:700; color:#ffe9b0; letter-spacing:4px; }
  #nextBtn { padding:14px 52px; font-size:min(5vw,26px); font-weight:700; color:#241a05;
    background:linear-gradient(180deg,#ffe2a0,#e0a94f); border:none; border-radius:50px;
    box-shadow:0 6px 20px rgba(224,169,79,.5); cursor:pointer; }
  #nextBtn:active { transform:scale(.95); }

  .bigChoice { position:absolute; bottom:5%; padding:14px 34px; font-size:min(5vw,26px); font-weight:700;
    border:none; border-radius:46px; cursor:pointer; color:#fff;
    box-shadow:0 5px 16px rgba(0,0,0,.45); }
  .draggable { touch-action:none; cursor:grab; }
</style>
</head>
<body>
<div id="app">
  <div id="startScreen" class="screen active">
    <img class="bgArt" src="assets/art/cover_bg.jpg" alt="">
    <div id="startTitle">Ada的时间之旅</div>
    <div id="startSub">时间是什么？一起去发现吧</div>
    <button id="startBtn">出 发</button>
  </div>

  <div id="mapScreen" class="screen">
    <img class="bgArt" src="assets/art/map_bg.jpg" alt="">
    <div id="mapTitle">✦ 跟着小星星，一起去找时间 ✦</div>
    <svg id="mapPath"></svg>
  </div>

  <div id="levelScreen" class="screen">
    <div id="stage"></div>
    <div id="hud">
      <div style="display:flex;gap:10px">
        <div class="hudBtn" id="homeBtn" title="回星空">
          <svg viewBox="0 0 24 24" fill="none" stroke="#f2e6c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/>
          </svg>
        </div>
        <div class="hudBtn" id="prevBtn" title="上一个">
          <svg viewBox="0 0 24 24" fill="none" stroke="#f2e6c8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 5 8 12l7 7"/>
          </svg>
        </div>
      </div>
      <div id="levelTitle"></div>
      <div style="display:flex;gap:10px">
        <div class="hudBtn" id="nextLvlBtn" title="下一个">
          <svg viewBox="0 0 24 24" fill="none" stroke="#f2e6c8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 5l7 7-7 7"/>
          </svg>
        </div>
        <div class="hudBtn" id="voiceBtn" title="再听一遍">
          <svg viewBox="0 0 24 24" fill="none" stroke="#f2e6c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9v6h4l5 4V5L8 9H4z" fill="#f2e6c8" stroke="none"/>
            <path d="M16 8a5 5 0 0 1 0 8"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>
          </svg>
        </div>
      </div>
    </div>
    <div id="doneOverlay">
      <svg id="doneStar" viewBox="0 0 100 100">
        <defs><radialGradient id="starG" cx="50%" cy="40%" r="70%">
          <stop offset="0%" stop-color="#fff6d8"/><stop offset="100%" stop-color="#e8a93c"/>
        </radialGradient></defs>
        <path d="M50 4 61 36 95 37 68 58 78 92 50 72 22 92 32 58 5 37 39 36 Z" fill="url(#starG)"
          stroke="#b57d1e" stroke-width="2" stroke-linejoin="round"/>
      </svg>
      <div id="doneMsg">真棒！</div>
      <button id="nextBtn">下一关 →</button>
    </div>
  </div>
  <div id="fadeOverlay"></div>
  <div id="hintHand">👆</div>
</div>
<script src="voice_lines.js"></script>
<script src="game.js"></script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
